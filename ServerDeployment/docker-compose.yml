version: '3.9'

services:
  spring:
    image: beecool/music-player:${IMAGE_TAG:-latest}
    container_name: spring_app
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT
      - SERVER_SESSION_COOKIE_HTTP_ONLY
      - SERVER_SESSION_COOKIE_SECURE
      - SERVER_SESSION_COOKIE_MAX_AGE
      - SERVER_SESSION_TIMEOUT
      - SPRING_DATA_REDIS_HOST
      - SPRING_DATA_REDIS_PORT
      - SPRING_DATASOURCE_URL
      - SPRING_DATASOURCE_USERNAME
      - SPRING_DATASOURCE_PASSWORD
      - SPRING_JPA_SHOW_SQL
      - ALIYUN_OSS_ENDPOINT
      - ALIYUN_OSS_BUCKET_NAME
      - ALIYUN_OSS_ACCESS_KEY
      - ALIYUN_OSS_SECRET_KEY
      - ALIYUN_OSS_EXPIRATION_HOURS
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SESSION
      - SERVER_COMPRESSION_ENABLED
      - SERVER_COMPRESSION_MIN_RESPONSE_SIZE
      - APP_CORS_ALLOWED_ORIGINS
      - APP_WEBSOCKET_ALLOWED_ORIGINS
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8082/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    image: beecool/music-player-frontend:${IMAGE_TAG:-latest}
    container_name: nginx_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs
    depends_on:
      spring:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:6.2
    container_name: redis_server
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
